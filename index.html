const SPK=Array.from({length:20},()=>`<i style="left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;--s:${6+Math.round(Math.random()*12)}px;--d:${(3+Math.random()*4).toFixed(1)}s;--l:${(Math.random()*6).toFixed(1)}s"></i>`).join('');
const lgBox=h=>{$('#lg').innerHTML=`<div class="spk">${SPK}</div><div class="lgc">${h}</div>`;$('#lg').style.display='flex'};
function msgF(t){const m=$('#er');if(!m)return;m.textContent=t;if(!t)return;m.classList.remove('sh');void m.offsetWidth;m.classList.add('sh')}
function lgSedes(){lgBox(`${LOGO}<h1>Escuela de entrenamiento</h1><p class="lgs">Bienvenidos supervisores · elige tu sede</p><div class="lgg">${SEDES.map(s=>`<button class="lgb" data-lg="${esc(s)}"><i>${sv('b')}</i>${esc(s)}<small>Sede</small></button>`).join('')}<button class="lgb mas" data-lg="MASTER"><i>${sv('m')}</i>Todas las sedes<small>Acceso general</small></button></div>`)}
function lgClave(sd){const m=sd==='MASTER';lgBox(`${LOGO}<div class="lgf"><div class="lgh"><i>${sv(m?'m':'b')}</i><div><small>${m?'Acceso general':'Sede'}</small><b>${m?'Todas las sedes':esc(sd)}</b></div></div><label>Ingresa la clave<span class="pw"><input id="lp" type="password" autocomplete="off" placeholder="Clave"><button type="button" class="lge" id="ey">Ver</button></span></label><div id="er" class="lgm"></div><div class="lgx"><button class="btn" id="lb">Volver</button><button class="btn pr" id="li" data-sd="${esc(sd)}">Continuar</button></div></div>`);setTimeout(()=>{const x=$('#lp');if(x)x.focus()},60)}
async function entrar(){
  const li=$('#li'),lx=$('.lgx'),lp=$('#lp');if(li){li.disabled=true;li.innerHTML='<span class="spn"></span>Confirmando credenciales…'}if(lx)lx.classList.add('busy');if(lp)lp.disabled=true;msgF('');
  try{await cargar();$('#lg').style.display='none';$('#lg').innerHTML='';$('#app').hidden=false;document.documentElement.style.setProperty('--hh',$('header').offsetHeight+'px');
    S.sede=AU==='MASTER'||DEMO?'all':AU;$('#who').textContent=(DEMO?'Datos de ejemplo':AU==='MASTER'?'Todas las sedes':AU);R()}
  catch(x){msgF((x.message&&x.message!=='Failed to fetch')?x.message:'No hay conexión con la hoja de datos.')}
  const l2=$('#li');if(l2){l2.disabled=false;l2.textContent='Continuar'}const l3=$('.lgx');if(l3)l3.classList.remove('busy');const l4=$('#lp');if(l4){l4.disabled=false;l4.focus()}}
document.addEventListener('click',e=>{const t=e.target.closest('#lg button');if(!t)return;
  if(t.dataset.lg)return lgClave(t.dataset.lg);
  if(t.id==='lb')return lgSedes();
  if(t.id==='ld'){DEMO=true;AU='MASTER';return entrar()}
  if(t.id==='ey'){const i=$('#lp'),v=i.type==='password';i.type=v?'text':'password';t.textContent=v?'Ocultar':'Ver';i.focus();return}
  if(t.id==='li'){AU=t.dataset.sd;CK=$('#lp').value.trim();DEMO=false;if(!CK)return msgF('Escribe la clave.');entrar()}});
